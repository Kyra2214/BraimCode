name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Decode development keystore
        env:
          KEYSTORE_B64: ${{ secrets.BRAINCODE_KEYSTORE_FILE }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/braincode-dev.jks"
          chmod 600 "$RUNNER_TEMP/braincode-dev.jks"
      - name: Build debug APK
        env:
          BRAINCODE_KEYSTORE_FILE: ${{ runner.temp }}/braincode-dev.jks
          BRAINCODE_KEYSTORE_PASSWORD: ${{ secrets.BRAINCODE_KEYSTORE_PASSWORD }}
          BRAINCODE_KEY_ALIAS: ${{ secrets.BRAINCODE_KEY_ALIAS }}
          BRAINCODE_KEY_PASSWORD: ${{ secrets.BRAINCODE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: braincode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
